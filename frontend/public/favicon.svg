<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle with Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2" />

  <!-- Highway Road Perspective -->
  <polygon points="12,54 24,14 40,14 52,54" fill="url(#roadGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Road Center Dashed Line -->
  <line x1="32" y1="16" x2="32" y2="24" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="28" x2="32" y2="38" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" />
  <line x1="32" y1="43" x2="32" y2="53" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />

  <!-- Left / Right Lane Lines -->
  <line x1="24" y1="14" x2="12" y2="54" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <line x1="40" y1="14" x2="52" y2="54" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.85" />

  <!-- Fast Car / Vehicle 1 (Left Lane, Cyan) -->
  <rect x="18" y="34" width="7" height="13" rx="2.5" fill="url(#cyanGlow)" filter="url(#glow)" />
  <circle cx="21.5" cy="36" r="1" fill="#ffffff" />
  <circle cx="21.5" cy="45" r="0.8" fill="#f43f5e" />

  <!-- Fast Car / Vehicle 2 (Right Lane, Emerald) -->
  <rect x="39" y="22" width="6" height="11" rx="2" fill="url(#emeraldGlow)" filter="url(#glow)" />
  <circle cx="42" cy="24" r="0.9" fill="#ffffff" />
  <circle cx="42" cy="31" r="0.7" fill="#f43f5e" />

  <!-- Top Signal Indicator Lights (Green, Yellow, Red) -->
  <rect x="23" y="6" width="18" height="6" rx="3" fill="#0b0f19" stroke="rgba(255,255,255,0.2)" stroke-width="0.8" />
  <circle cx="27" cy="9" r="1.8" fill="#10b981" filter="url(#glow)" />
  <circle cx="32" cy="9" r="1.8" fill="#f59e0b" opacity="0.4" />
  <circle cx="37" cy="9" r="1.8" fill="#f43f5e" opacity="0.4" />
</svg>