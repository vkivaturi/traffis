[package]
name = "traffis-desktop"
version = "0.1.0"
description = "Traffis Desktop — Microscopic Traffic Simulation"
authors = ["Traffis"]
edition = "2021"

[lib]
name = "traffis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

